server {
    listen 80;
    server_name rashed.taqwaglobaleducation.com;

    root /var/www/rashed/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
